name: Check CamCore DNS source health

on:
  workflow_run:
    workflows:
      - "Publish CamCore DNS blocklist"
    types:
      - completed
  schedule:
    - cron: "23 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camcore-dns-source-health
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Check approved production sources
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate repository policy
        run: python camcore/tools/validate_repository.py

      - name: Check published production feed
        run: python camcore/tools/check_sources.py
