name: Publish CamCore DNS blocklist

on:
  push:
    branches:
      - main
    paths:
      - "camcore/sources.json"
      - "camcore/allowlist.txt"
      - "camcore/denylist.txt"
      - "camcore/tools/**"
      - "camcore/tests/**"
      - ".github/workflows/camcore-publish.yml"
  schedule:
    - cron: "45 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: camcore-dns-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish production feed
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run unit tests before publishing
        run: python -m unittest discover -s camcore/tests -v

      - name: Validate repository policy
        run: python camcore/tools/validate_repository.py

      - name: Build CamCore blocklist
        run: python camcore/tools/publish_blocklist.py

      - name: Publish changed blocklists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # blocklist-adblock.txt is the production feed; blocklist.txt is the
          # exact-match rollback feed (OPS-1062). Both carry the same domains.
          for feed in blocklist-adblock.txt blocklist.txt; do
            if git ls-files --error-unmatch "${feed}" > /dev/null 2>&1 && git diff --quiet -- "${feed}"; then
              echo "${feed} is already current."
              continue
            fi

            # A missing file on main has no SHA; the contents API then creates it.
            current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${feed}?ref=main" --jq '.sha' 2> /dev/null || true)"
            export FEED="${feed}" CURRENT_SHA="${current_sha}"

            python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          feed = os.environ["FEED"]
          payload = {
              "message": f"chore(dns): refresh published {feed}",
              "content": base64.b64encode(Path(feed).read_bytes()).decode("ascii"),
              "branch": "main",
          }
          if os.environ.get("CURRENT_SHA"):
              payload["sha"] = os.environ["CURRENT_SHA"]
          Path("/tmp/camcore-blocklist-payload.json").write_text(
              json.dumps(payload), encoding="utf-8"
          )
          PY

            gh api \
              --method PUT \
              "repos/${GITHUB_REPOSITORY}/contents/${feed}" \
              --input /tmp/camcore-blocklist-payload.json \
              > /dev/null

            echo "Published updated ${feed}."
          done
